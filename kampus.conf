<VirtualHost *:80>
    ServerName kampus.rumahku.web.id
    ServerAdmin webmaster@rumahku.web.id
    DocumentRoot /var/www/kampus-dosen/current/apps/web/dist

    <Directory /var/www/kampus-dosen/current/apps/web/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Fallback to index.html for React SPA client-side routing
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Reverse proxy API requests to Node.js backend on isolated port 3005
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3005/api
    ProxyPassReverse /api http://127.0.0.1:3005/api

    ErrorLog ${APACHE_LOG_DIR}/kampus_error.log
    CustomLog ${APACHE_LOG_DIR}/kampus_access.log combined
</VirtualHost>
